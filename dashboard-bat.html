<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Indicadores de Gestión · BAT</title>
<!-- Librerías Externas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#003087;
    --navy-2:#00236B;
    --panel:#FFFFFF;
    --bg:#F2F5FA;
    --line:#D0D8EC;
    --amber:#0057B8;
    --gold:#0057B8;
    --teal:#00A3E0;
    --red:#D0021B;
    --green:#1A7A3C;
    --ink:#1A1A1A;
    --muted:#5A6A8A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);text-align:left;}
  
  .sticky-shell{position:sticky;top:0;z-index:60;box-shadow:0 4px 18px rgba(0,0,0,.2);}
  header.top{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;
    position:relative;z-index:auto;box-shadow:none;border-bottom:3px solid var(--gold);
    flex-wrap: wrap; gap: 12px;
  }
  .brand{display:flex;align-items:center;gap:16px;}
  .logo-badge{
    width:46px;height:46px;border-radius:10px;background:#fff;color:#003087;
    display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:15px;letter-spacing:.5px;flex-shrink:0;border:2px solid #0057B8;
  }
  header.top h1{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:21px;letter-spacing:.5px;
    margin:0;text-transform:uppercase;color:#fff;text-align:left;
  }
  header.top .tag{font-size:11px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-top:2px;font-weight:600;text-align:left;}
  
  .header-controls{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  
  .btn-upload{
    background:#00A3E0;color:#fff;border:none;padding:8px 16px;border-radius:8px;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s;
  }
  .btn-upload:hover{background:#0082b3;}
  .btn-pdf{background:#F2B705;color:#003087;border:none;padding:9px 15px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;}
  .btn-pdf:hover{background:#ffd447;}
  .upload-menu{position:relative;}
  .upload-panel{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:310px;padding:14px;background:#00236B;border:1px solid rgba(255,255,255,.2);border-radius:12px;box-shadow:0 12px 28px rgba(0,0,0,.25);gap:9px;flex-direction:column;}
  .upload-menu:hover .upload-panel,.upload-menu:focus-within .upload-panel{display:flex;}
  .upload-panel .btn-upload{width:100%;justify-content:center;}

  .status-pill{
    display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:6px 14px;font-size:12px;
    font-family:'JetBrains Mono',monospace;
  }
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(31,182,165,.25);}
  
  /* BARRA DE CATEGORÍAS PRINCIPALES */
  .category-bar{
    background:var(--navy);padding:8px 20px 0;display:flex;gap:8px;border-bottom:1px solid rgba(255,255,255,.15);
  }
  .category-btn{
    background:rgba(255,255,255,.1);border:none;color:#d0d8ec;padding:10px 20px;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.5px;
    border-radius:8px 8px 0 0;cursor:pointer;transition:.15s;text-align:left;
  }
  .category-btn:hover{background:rgba(255,255,255,.2);color:#fff;}
  .category-btn.active{background:var(--navy-2);color:#fff;border-top:3px solid var(--teal);}

  /* BARRA DE SUB-PESTAÑAS */
  nav.tabs{
    display:flex;gap:4px;overflow-x:auto;background:var(--navy-2);padding:0 20px;
    border-bottom:1px solid rgba(255,255,255,.08);position:relative;z-index:40;
  }
  nav.tabs button{
    background:none;border:none;color:#A9B3CC;padding:12px 16px;font-family:'Barlow Condensed',sans-serif;
    font-weight:600;font-size:14px;letter-spacing:.3px;cursor:pointer;white-space:nowrap;
    border-bottom:3px solid transparent;transition:.15s;text-align:left;
  }
  nav.tabs button:hover{color:#fff;}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--teal);}
  
  main{padding:24px 28px 60px;max-width:1320px;margin:0 auto;text-align:left;}
  .section{display:none;}
  .section.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  
  .section-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;text-align:left;}
  .section-head div{text-align:left;}
  .section-head h2{
    font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;margin:0;color:var(--navy);text-align:left;
  }
  .section-head .eyebrow{font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:2px;text-align:left;}
  
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-start;}
  select{
    font-family:'Inter',sans-serif;font-size:13px;padding:8px 12px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;text-align:left;
  }
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;
  }
  .kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;text-align:left;}
  .kpi .value{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;margin-top:4px;text-align:left;}
  .kpi .value.good{color:var(--teal);}
  .kpi .value.bad{color:var(--red);}
  .kpi .value.neutral{color:var(--navy);}
  
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;text-align:left;
  }
  .card h3{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;margin:0 0 12px;color:var(--navy);text-align:left;}
  .chart-wrap{position:relative;height:420px;padding:8px 4px 0;}
  .chart-wrap.full{height:440px;}
  .chart-wrap.mini{height:270px;}
  
  table{width:100%;border-collapse:collapse;font-size:12.5px;text-align:left;}
  table th{
    background:var(--navy);color:#fff;padding:8px 10px;text-align:left;font-weight:600;
    font-family:'Barlow Condensed',sans-serif;letter-spacing:.3px;position:sticky;top:0;
  }
  table td{padding:7px 10px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;text-align:left;}
  table tbody tr:hover{background:#F7F9FC;}
  .table-scroll{max-height:420px;overflow:auto;border-radius:8px;border:1px solid var(--line);}
  .summary-table{width:100%;min-width:0;table-layout:fixed;}
  .summary-table th,.summary-table td{width:5.88%;padding:7px 4px;text-align:center;white-space:normal;overflow-wrap:anywhere;word-break:normal;font-size:10px;}
  .summary-table th{line-height:1.2;}
  .summary-table th:nth-child(n+3):nth-child(-n+7){background:#0057B8;}
  .summary-table th:nth-child(n+8):nth-child(-n+12){background:#478A43;}
  .summary-table th:nth-child(n+13):nth-child(-n+17){background:#B77900;}
  .summary-table td:nth-child(n+3):nth-child(-n+7){background:#EEF5FF;}
  .summary-table td:nth-child(n+8):nth-child(-n+12){background:#F0F8EF;}
  .summary-table td:nth-child(n+13):nth-child(-n+17){background:#FFF8E6;}
  .detail-table{min-width:1250px;}
  .detail-table th,.detail-table td{vertical-align:top;}
  .detail-table td:last-child{font-family:'Inter',sans-serif;min-width:360px;max-width:560px;white-space:normal;line-height:1.45;}
  
  .state{padding:60px 20px;text-align:left;color:var(--muted);font-size:14px;}
  .state.error{color:var(--red);}
  .kpi-row.compact{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
  .metric-badge{display:inline-block;border-radius:5px;padding:3px 7px;font-weight:700;white-space:nowrap;}
  .metric-badge.yellow{background:#FFF1A8;color:#533F00;}
  .metric-badge.red{background:#FAD6D6;color:#8A1010;}
  .metric-badge.blue{background:#DCEBFF;color:#003087;}
  @media(max-width:700px){.sticky-shell{position:sticky}.header-controls{width:100%}.upload-panel{left:0;right:auto}main{padding:18px 14px}.chart-wrap{height:340px}.chart-wrap.full{height:360px}}
  #pdf-report{display:none;}
  .preparing-pdf .sticky-shell{position:static;box-shadow:none;}
  .preparing-pdf .category-bar,.preparing-pdf nav.tabs,.preparing-pdf #main{display:none!important;}
  .preparing-pdf .header-controls{display:none!important;}
  .preparing-pdf #pdf-report{display:block!important;padding:12px 18px;}
  .preparing-pdf #pdf-report .section{display:block!important;animation:none!important;break-before:auto;page-break-before:auto;margin:0 0 10px;}
  .preparing-pdf #pdf-report .section-head{margin-bottom:8px;}
  .preparing-pdf #pdf-report .section-head h2{font-size:20px;}
  .preparing-pdf #pdf-report .pdf-category + .pdf-category{break-before:page;page-break-before:always;}
  .preparing-pdf #pdf-report .card{break-inside:avoid;page-break-inside:avoid;box-shadow:none;padding:11px 13px;margin-bottom:9px;border-radius:9px;}
  .preparing-pdf #pdf-report .card h3{font-size:14px;margin-bottom:6px;}
  .preparing-pdf #pdf-report .kpi-row{gap:7px;margin-bottom:9px;}
  .preparing-pdf #pdf-report .kpi{padding:8px 10px;border-radius:8px;}
  .preparing-pdf #pdf-report .kpi .value{font-size:20px;}
  .preparing-pdf #pdf-report .card.pdf-breakable{break-inside:auto;page-break-inside:auto;}
  .preparing-pdf #pdf-report table tbody tr{break-inside:avoid;page-break-inside:avoid;}
  .preparing-pdf #pdf-report .chart-wrap,.preparing-pdf #pdf-report .chart-wrap.full{height:235px;padding:2px 2px 0;}
  .preparing-pdf #pdf-report .table-scroll{max-height:none;overflow:visible;border:0;}
  .preparing-pdf #pdf-report table{font-size:8px;}
  .preparing-pdf #pdf-report table th,.preparing-pdf #pdf-report table td{padding:4px 5px;}
  .preparing-pdf #pdf-report table thead{display:table-header-group;}
  .preparing-pdf #pdf-report .detail-table{min-width:0;table-layout:fixed;width:100%;font-size:7px;}
  .preparing-pdf #pdf-report .detail-table th,.preparing-pdf #pdf-report .detail-table td{padding:4px 3px;overflow-wrap:anywhere;}
  .preparing-pdf #pdf-report .detail-table td:last-child{min-width:0;max-width:none;font-size:7px;}
  .pdf-report-header{padding:4px 4px 8px;border-bottom:2px solid #003087;margin-bottom:8px;color:#003087;}
  .pdf-report-header h1{font-family:'Barlow Condensed',sans-serif;font-size:22px;margin:0 0 3px;text-transform:uppercase;}
  .pdf-report-header p{font-size:10px;margin:0;color:#58657a;}
  .pdf-category-title{font-family:'Barlow Condensed',sans-serif;font-size:19px;color:#003087;margin:5px 0 8px;}
  @media print{
    @page{size:A4 landscape;margin:7mm;}
    body.preparing-pdf{background:#fff!important;color:#1a1a1a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body.preparing-pdf #pdf-report{padding:0;}
    body.preparing-pdf .card{border-color:#ccd6e8!important;}
    body.preparing-pdf .kpi,body.preparing-pdf .pdf-report-header{break-inside:avoid;}
    body.preparing-pdf tr{break-inside:avoid;page-break-inside:avoid;}
  }
</style>
</head>
<body>

<div class="sticky-shell">
<header class="top">

  </div>
  <div class="header-controls">
    <button type="button" class="btn-pdf" id="downloadPdfBtn" onclick="downloadDashboardPDF()">⬇ Descargar informe PDF</button>

</header>

<!-- NIVEL 1: CATEGORÍAS PRINCIPALES -->
<div class="category-bar">
  <button class="category-btn active" id="btnCatTransporte" onclick="switchCategory('transporte')">1. TRANSPORTE</button>
  <button class="category-btn" id="btnCatAlmacenamiento" onclick="switchCategory('almacenamiento')">2. ALMACENAMIENTO</button>
</div>

<!-- NIVEL 2: SUB-PESTAÑAS -->
<nav class="tabs" id="tabsNav"></nav>
</div>

<main id="main"></main>

<script>
let localWorkbookData = {transporte:{},almacenamiento:{}};
let localWorkbookNames = {transporte:[],almacenamiento:[]};
let currentCategory = 'transporte';

const CATEGORIES = {
  transporte: {
    label: "1. Transporte",
    tabs: [
      { id: 'general',             label: '1. Estado general operación BAT', sheetIndex: 0 },
      { id: 'ontime',              label: '1.1 Ontime',               sheetIndex: 1 },
      { id: 'infull',              label: '1.2 In Full',              sheetIndex: 2 },
      { id: 'efectividad',         label: '1.3 % Efectividad',         sheetIndex: 3 },
      { id: 'retorno',             label: '1.4 % Retorno Documental',  sheetIndex: 4 },
      { id: 'averias',             label: '1.5 Averías / Hurtos', sheetIndex: 6 }
    ]
  },
  almacenamiento: {
    label: "2. Almacenamiento",
    tabs: [
      { id: 'inventario_ciclico',  label: '2.1 % Inventario Cíclico', sheetIndex: 0 },
      { id: 'ocupacion_bodega',    label: '2.2 % Ocupación Bodega Día Celta', sheetIndex: 1 },
      { id: 'cantidad_ingresos',   label: '2.3 Cantidad de Ingresos', sheetIndex: 2 },
      { id: 'armado_cigarrillos', label: '2.4 Armado Cigarrillos Celta', sheetIndex: 3 }
    ]
  }
};

const PALETTE = ['#003087','#0057B8','#00A3E0','#5A6A8A','#D0021B','#00236B','#7BA7D4'];
Chart.register(ChartDataLabels);
Chart.defaults.font.family = "'Inter', sans-serif";
Chart.defaults.plugins.datalabels = Chart.defaults.plugins.datalabels || {};

const FULL_MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function parseNum(v){
  if(v===undefined||v===null) return null;
  let s = String(v).trim();
  if(s==='' || s==='-' || s.toLowerCase()==='n/a') return null;
  const hadPct = s.includes('%');
  s = s.replace(/%/g,'').replace(/\$/g,'').replace(/\s/g,'').replace(/COP/gi,'');
  if(s.includes(',') && s.includes('.')){
    if(s.lastIndexOf(',') > s.lastIndexOf('.')){
      s = s.replace(/\./g,'').replace(',', '.');
    } else {
      s = s.replace(/,/g,'');
    }
  } else if(s.includes(',')){
    const parts = s.split(',');
    if(parts.length===2 && parts[1].length===3 && parts[0].length>0){
      s = s.replace(',','');
    } else {
      s = s.replace(',', '.');
    }
  } else if(s.includes('.')){
    const parts = s.split('.');
    if(parts.length > 2){
      s = s.replace(/\./g,'');
    } else if(parts.length === 2 && parts[1].length === 3 && parseInt(parts[0]) > 9){
      s = s.replace('.','');
    }
  }
  const n = parseFloat(s);
  if(isNaN(n)) return null;
  if(hadPct && Math.abs(n) > 1) return n/100;
  return n;
}

function fmtPct(n){ return n===null?'—':(n*100).toLocaleString('es-CO',{maximumFractionDigits:1})+'%'; }
function fmtNum(n){ return n===null?'—':n.toLocaleString('es-CO',{maximumFractionDigits:1}); }
function fmtCOP(n){ if(n===null||n===0) return '$0'; return '$'+Math.round(n).toLocaleString('es-CO',{maximumFractionDigits:0}); }

function lineDL(color, formatter, textColor){
  return {
    display:true,
    backgroundColor: color,
    borderRadius: 4,
    color: textColor || '#ffffff',
    padding: {top:3, bottom:3, left:6, right:6},
    font: {size:10, weight:'700'},
    anchor:'end',
    align:'top',
    formatter: formatter
  };
}

function findKey(row, ...candidates){
  if(!row) return null;
  const keys = Object.keys(row);
  const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
  for(const c of candidates){
    const k = keys.find(k => norm(k) === norm(c));
    if(k) return k;
  }
  for(const c of candidates){
    const k = keys.find(k => norm(k).includes(norm(c)));
    if(k) return k;
  }
  return null;
}

const MONTH_ORDER = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function monthIndex(m){
  if(!m) return 99;
  const s = String(m).toLowerCase().trim();
  const i = MONTH_ORDER.findIndex(mo => s.startsWith(mo.slice(0,3)));
  return i===-1?99:i;
}

async function getSheetData(tabIndex, source='transporte'){
  return localWorkbookData[source]?.[tabIndex] || [];
}

function monthFromDate(value){
  if(value instanceof Date && !isNaN(value)) return FULL_MONTHS[value.getMonth()];
  const s=String(value??'').trim();
  let m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if(m)return FULL_MONTHS[Number(m[2])-1]||'';
  m=s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})$/);
  if(m){
    const first=Number(m[1]),second=Number(m[2]);
    // Las fechas ambiguas de este detalle se muestran en formato mes/día/año.
    const month=first>12?second:first;
    return FULL_MONTHS[month-1]||'';
  }
  const parsed=new Date(s);
  return isNaN(parsed)?'':FULL_MONTHS[parsed.getMonth()];
}
function canonicalMonth(value){
  const s=String(value??'').trim().toLowerCase();
  const index=MONTH_ORDER.findIndex(m=>s.startsWith(m.slice(0,3)));
  return index<0?String(value??'').trim():FULL_MONTHS[index];
}

function worksheetRows(ws, sheetIndex){
  const matrix = XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
  let headerIndex = matrix.findIndex(row=>row.some(v=>String(v).trim().toLowerCase()==='mes'));
  if(headerIndex<0) headerIndex=matrix.findIndex(row=>{
    const cells=row.map(v=>String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim());
    return cells.includes('fecha') && cells.includes('hub') && cells.some(v=>v.includes('orden de venta'));
  });
  if(headerIndex<0) return [];
  const rawHeaders=matrix[headerIndex];
  const seen={};
  const headers=rawHeaders.map((v,i)=>({value:String(v||'').trim(),index:i})).filter(h=>h.value).map(h=>{
    seen[h.value]=(seen[h.value]||0)+1;
    return {key:seen[h.value]>1?`${h.value}_${h.index+1}`:h.value,index:h.index};
  });
  const monthHeader=headers.find(h=>h.key.toLowerCase()==='mes')?.key;
  const dateHeader=headers.find(h=>['fecha','dia'].includes(h.key.toLowerCase()))?.key;
  const rows=[]; let currentMonth='', currentDate='';
  for(const row of matrix.slice(headerIndex+1)){
    if(!row.some(v=>String(v).trim()!=='')) continue;
    const obj={}; headers.forEach(h=>obj[h.key]=row[h.index]??'');
    if(monthHeader&&obj[monthHeader]){currentMonth=obj[monthHeader];currentDate=(dateHeader&&obj[dateHeader])||'';}
    else if(monthHeader){obj[monthHeader]=currentMonth;if(dateHeader&&!obj[dateHeader])obj[dateHeader]=currentDate;}
    rows.push(obj);
  }
  return rows;
}

const charts = {};

async function loadPublishedSheets(source){
  const config=PUBLISHED_SHEETS[source];
  if(!config)return;
  const status=document.getElementById(source==='transporte'?'transportSync':'storageSync');
  status.textContent='Conectando con Google Sheets…';
  try{
    if(location.protocol==='file:')throw new Error('Este HTML está abierto como archivo local. Ábrelo con “Abrir dashboard BAT.bat” para conectar Google Sheets.');
    const localServer=['127.0.0.1','localhost'].includes(location.hostname);
    let csvSheets;
    if(localServer){
      const response=await fetch(`/api/google-sheets?source=${encodeURIComponent(source)}`,{cache:'no-store'});
      if(!response.ok)throw new Error(`Servidor local: respuesta HTTP ${response.status}`);
      const payload=await response.json();
      if(payload.error)throw new Error(payload.error);
      csvSheets=payload.sheets;
    }else{
      csvSheets=await Promise.all(config.sheets.map(async sheet=>{
        const response=await fetch(config.base+encodeURIComponent(sheet.gid),{mode:'cors',credentials:'omit',cache:'no-store'});
        if(!response.ok)throw new Error(`${sheet.name}: respuesta HTTP ${response.status}`);
        return {...sheet,csv:await response.text()};
      }));
    }
    const loaded=csvSheets.map(sheet=>{
      const csv=sheet.csv;
      const parsed=Papa.parse(csv,{skipEmptyLines:false});
      if(parsed.errors.some(e=>e.type==='Quotes'))throw new Error(`No se pudo leer el CSV de ${sheet.name}.`);
      const worksheet=XLSX.utils.aoa_to_sheet(parsed.data);
      const rows=worksheetRows(worksheet,sheet.index);
      if(!rows.length)throw new Error(`No se encontraron encabezados reconocibles en ${sheet.name}.`);
      return [sheet.index,rows];
    });
    const nextData={};loaded.forEach(([index,rows])=>nextData[index]=rows);
    localWorkbookData[source]=nextData;
    localWorkbookNames[source]=config.sheets.map(s=>s.name);
    status.textContent=`Google Sheets actualizado · ${new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}`;
    const activeBtn=document.querySelector('nav.tabs button.active');
    if(activeBtn){
      const id=activeBtn.dataset.id;
      const isStorage=CATEGORIES.almacenamiento.tabs.some(t=>t.id===id);
      if((source==='almacenamiento')===isStorage)RENDERERS[id](document.getElementById('sec-'+id));
    }
  }catch(err){
    status.textContent='Error al actualizar desde Google Sheets';
    console.error('No fue posible leer las hojas publicadas:',err);
    alert(`No se pudo actualizar ${source==='transporte'?'Transporte':'Almacenamiento'} desde Google Sheets. Verifica la conexión y que las hojas sigan publicadas. ${err.message}`);
  }
}

function makeChart(canvasId, config){
  if(charts[canvasId]) charts[canvasId].destroy();
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  charts[canvasId] = new Chart(ctx, config);
  return charts[canvasId];
}

function monthSelector(id, months, onChange, defaultValue){
  const el = document.getElementById(id);
  if(!el) return;
  el.innerHTML = '';
  const sel = document.createElement('select');
  sel.innerHTML = `<option value="__all">Todos los meses</option>` +
    months.map(m=>`<option value="${m}">${m}</option>`).join('');
  if(defaultValue && months.includes(defaultValue)) sel.value = defaultValue;
  sel.addEventListener('change', e=>onChange(e.target.value));
  el.appendChild(sel);
  return sel;
}

async function renderGeneral(container){
  container.innerHTML = `<div class="state">${localWorkbookData.transporte[0] ? 'Leyendo estado general…' : 'Cargue el Excel de Transporte para consultar el estado general BAT.'}</div>`;
  const rows = await getSheetData(0);
  if(!rows.length) return;
  const keys = Object.keys(rows[0]);
  const monthKey = findKey(rows[0], 'mes');
  const headers = keys.map(k=>k.replace(/\s*[_\d]+$/,''));
  const isGeneral = keys.some(k=>/ontime/i.test(k)) && keys.some(k=>/infull/i.test(k));
  const totalKeys=keys.filter(k=>/^total(?:_\d+)?$/i.test(k));
  const metrics=[{name:'% Ontime',rate:keys.find(k=>/^%\s*ontime$/i.test(k)),good:findKey(rows[0],'entregas a tiempo'),total:totalKeys[0],color:'#00A3E0'},
    {name:'% Infull',rate:keys.find(k=>/^%\s*infull$/i.test(k)),good:findKey(rows[0],'entregas completas'),total:totalKeys[1],color:'#F2B705'},
    {name:'% Efectividad',rate:keys.find(k=>/^%\s*efectividad$/i.test(k)),good:findKey(rows[0],'entregas efectivas'),total:totalKeys[2],color:'#6D5BD0'}];
  const kpis=metrics.map(m=>{let good=0,total=0;rows.forEach(r=>{good+=parseNum(r[m.good])||0;total+=parseNum(r[m.total])||0;});return {name:m.name,value:total?good/total:null,color:m.color};});
  container.innerHTML = `<div class="section-head"><div><div class="eyebrow">1. Transporte</div><h2>Estado general operación BAT</h2></div></div>
    <div class="kpi-row">${kpis.map(k=>`<div class="kpi" style="border-top:4px solid ${k.color}"><div class="label">${k.name} consolidado</div><div class="value" style="color:#1A7A3C">${k.value===null?'—':(k.value*100).toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'}</div></div>`).join('')}</div>
    ${isGeneral ? `<div class="card"><h3>Comportamiento mensual de indicadores — consolidado por mes</h3><div class="chart-wrap full"><canvas id="generalChart"></canvas></div></div>` : ''}
    <div class="card"><h3>Resumen mensual de indicadores</h3><div class="table-scroll"><table class="summary-table"><thead><tr>${headers.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${r[k] ?? ''}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  if(isGeneral){
    const labels = rows.map(r=>r[monthKey]).filter(Boolean);
    makeChart('generalChart',{type:'bar',data:{labels,datasets:metrics.map(m=>({label:m.name,data:rows.map(r=>{const g=parseNum(r[m.good]),t=parseNum(r[m.total]);return t?g/t*100:null;}),backgroundColor:m.color,borderRadius:4,barThickness:52,maxBarThickness:56,barPercentage:.9,categoryPercentage:.95,datalabels:{display:true,backgroundColor:m.color,color:'#fff',borderRadius:4,padding:{top:2,bottom:2,left:2,right:2},anchor:'center',align:'center',font:{size:9,weight:'700'},formatter:v=>v==null?'':v.toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'}}))},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:20}},plugins:{legend:{position:'bottom'},datalabels:{display:true,clip:false,clamp:true}},scales:{y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'},title:{display:true,text:'Cumplimiento'}}}}});
  }

function safeCell(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dataTable(rows, keys){
  const cell=(key,value)=>{const numeric=parseNum(value);if(numeric!==null&&String(key).toLowerCase()==='valor')return safeCell(fmtCOP(numeric));if(numeric!==null&&/(unidades|estibas|ubicaciones|posiciones|cantidad unidades)/i.test(key))return safeCell(fmtNum(Math.round(numeric)));return safeCell(value);};
  return `<div class="table-scroll"><table><thead><tr>${keys.map(k=>`<th>${safeCell(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${cell(k,r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function groupedByMonth(rows, monthKey, fields){
  const groups={};
  rows.forEach(r=>{const m=r[monthKey];if(!m)return;const g=groups[m]||(groups[m]={n:0,...Object.fromEntries(fields.map(f=>[f,0]))});g.n++;fields.forEach(f=>g[f]+=parseNum(r[f])||0);});
  return groups;
}

  makeChart(canvas,{type:'bar',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:26}},interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,title:{display:true,text:'Promedio diario'}},y1:{beginAtZero:true,max:1,position:'right',grid:{drawOnChartArea:false},ticks:{callback:v=>(v*100).toFixed(0)+'%'},title:{display:true,text:'Porcentaje'}}}}});

    container.innerHTML=`<div class="section-head"><div><div class="eyebrow">1. Transporte</div><h2>1.5 Averías / Hurtos</h2></div><div class="controls" id="averias-filter"></div></div><div class="kpi-row" id="averias-kpis"></div><div class="card"><h3>Novedades por mes y acumulado</h3><div class="chart-wrap full"><canvas id="averias-chart"></canvas></div></div><div class="card"><h3>Registros del Excel</h3><div id="averias-table"></div></div>`;
    const tableKeys=keys.filter(k=>!['nombre conductor','valor'].includes(k.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()));tableKeys.push('Valor');
    function draw(m){
      const filtered=valid.filter(r=>m==='__all'||r[monthKey]===m), counts={},valueTotals={};
      filtered.forEach(r=>{const mon=r[monthKey];counts[mon]=(counts[mon]||0)+1;const amount=valueKey?parseNum(r[valueKey]):null;if(amount!==null)valueTotals[mon]=(valueTotals[mon]||0)+amount;});
      const numericValues=filtered.map(r=>valueKey?parseNum(r[valueKey]):null).filter(v=>v!==null);
      const sumValue=numericValues.length?numericValues.reduce((a,b)=>a+b,0):null;
      document.getElementById('averias-kpis').innerHTML=`<div class="kpi"><div class="label">Novedades registradas</div><div class="value neutral">${fmtNum(filtered.length)}</div></div><div class="kpi"><div class="label">Valor acumulado</div><div class="value neutral">${sumValue===null?'Sin valores numéricos':fmtCOP(sumValue)}</div></div>`;
      const labels=Object.keys(counts).sort((a,b)=>monthIndex(a)-monthIndex(b));let n=0;const cumulative=labels.map(x=>n+=counts[x]);
      const valueLine=labels.map(m=>valueTotals[m]??null);
      const averiasDatasets=[
        {label:'Cantidad de novedades',data:labels.map(x=>counts[x]),backgroundColor:'#003087',yAxisID:'y',datalabels:{display:true,backgroundColor:'#FFF1A8',color:'#533F00',borderRadius:4,padding:5,anchor:'center',align:'center',formatter:v=>fmtNum(v)}},
        {label:'Novedades acumuladas',data:cumulative,type:'line',borderColor:'#D0021B',backgroundColor:'#D0021B',borderWidth:3,tension:.3,pointRadius:5,yAxisID:'y',datalabels:{display:true,backgroundColor:'#FAD6D6',color:'#8A1010',borderRadius:4,padding:5,align:'top',offset:8,formatter:v=>fmtNum(v)}}
      ];
      if(numericValues.length)averiasDatasets.push({label:'Valor',data:valueLine,type:'line',borderColor:'#00A3E0',backgroundColor:'#00A3E0',borderWidth:2.5,tension:.3,pointRadius:5,yAxisID:'y1',datalabels:{display:ctx=>ctx.raw!==null,backgroundColor:'#DCEBFF',color:'#003087',borderRadius:4,padding:5,align:'bottom',offset:8,formatter:v=>fmtCOP(v)}});
      makeChart('averias-chart',{type:'bar',data:{labels,datasets:averiasDatasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:ctx=>ctx.dataset.label==='Valor'?`${ctx.dataset.label}: ${fmtCOP(ctx.raw)}`:`${ctx.dataset.label}: ${fmtNum(ctx.raw)}`}}},scales:{y:{beginAtZero:true,title:{display:true,text:'Cantidad de novedades'}},y1:{display:numericValues.length>0,beginAtZero:true,position:'right',grid:{drawOnChartArea:false},ticks:{callback:v=>fmtCOP(v)},title:{display:true,text:'Valor ($)'}}}}});
      const tableRows=filtered.map(r=>({...r,Valor:valueKey&&parseNum(r[valueKey])!==null?r[valueKey]:''}));
      document.getElementById('averias-table').innerHTML=dataTable(tableRows,tableKeys);
    }
    draw('__all');monthSelector('averias-filter',months,draw);
  });
}

async function downloadDashboardPDF(){
  const btn=document.getElementById('downloadPdfBtn');
  const main=document.getElementById('main');
  const tabs=document.getElementById('tabsNav');
  const report=document.getElementById('pdf-report');
  const activeTab=tabs.querySelector('button.active')?.dataset.id || CATEGORIES[currentCategory].tabs[0].id;
  const savedFilters=new Map(Array.from(main.querySelector('.section.active')?.querySelectorAll('select')||[]).map(s=>[s.id,s.value]));
  const oldMainNodes=Array.from(main.childNodes),oldTabNodes=Array.from(tabs.childNodes);
  const previousCategory=currentCategory;
  btn.disabled=true;btn.textContent='Preparando informe…';
  main.replaceChildren();tabs.replaceChildren();report.replaceChildren();
  const generatedAt=new Date().toLocaleString('es-CO',{dateStyle:'long',timeStyle:'short'});
  report.insertAdjacentHTML('beforeend',`<header class="pdf-report-header"><h1>Informe de gestión operación BAT</h1><p>Transporte y Almacenamiento · Generado el ${safeCell(generatedAt)}</p></header>`);
  document.body.classList.add('preparing-pdf');
  const renderTasks=[];
  for(const [categoryKey,category] of Object.entries(CATEGORIES)){
    const categoryBlock=document.createElement('div');
    categoryBlock.className='pdf-category';
    const title=document.createElement('h2');title.className='pdf-category-title';title.textContent=category.label;
    categoryBlock.appendChild(title);
    for(const tab of category.tabs){
      const section=document.createElement('div');
      section.className='section active'+(renderTasks.length===0?' pdf-first':'');
      section.id=`sec-${tab.id}`;
      categoryBlock.appendChild(section);
      if(RENDERERS[tab.id])renderTasks.push({id:tab.id,section});
    }
    report.appendChild(categoryBlock);
  }
  try{
    await Promise.all(renderTasks.map(async task=>{
      try{await RENDERERS[task.id](task.section);}
      catch(err){task.section.innerHTML=`<div class="state error">No fue posible preparar esta sección: ${safeCell(err.message)}</div>`;}
    }));
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    Object.values(charts).filter(chart=>chart.canvas?.isConnected).forEach(chart=>chart.resize());
    const restore=()=>{
      document.body.classList.remove('preparing-pdf');
      report.replaceChildren();
      main.replaceChildren(...oldMainNodes);tabs.replaceChildren(...oldTabNodes);
      currentCategory=previousCategory;
      btn.disabled=false;btn.textContent='⬇ Descargar informe PDF';
      const activeSection=main.querySelector(`#sec-${activeTab}`);
      if(activeSection&&RENDERERS[activeTab]){
        Promise.resolve(RENDERERS[activeTab](activeSection)).then(()=>{
          savedFilters.forEach((value,id)=>{
            const select=document.getElementById(id);
            if(select&&Array.from(select.options).some(option=>option.value===value)){
              select.value=value;select.dispatchEvent(new Event('change',{bubbles:true}));
            }
          });
        });
      }
    };
    window.addEventListener('afterprint',restore,{once:true});
    window.print();
  }catch(err){
    document.body.classList.remove('preparing-pdf');
    report.replaceChildren();main.replaceChildren(...oldMainNodes);tabs.replaceChildren(...oldTabNodes);
    currentCategory=previousCategory;btn.disabled=false;btn.textContent='⬇ Descargar informe PDF';
    alert(`No se pudo preparar el informe PDF: ${err.message}`);
  }
}

// ================= GESTIÓN DE CATEGORÍAS Y PEAÑAS =================

function switchCategory(catKey){
  currentCategory = catKey;
  
  document.getElementById('btnCatTransporte').classList.toggle('active', catKey === 'transporte');
  document.getElementById('btnCatAlmacenamiento').classList.toggle('active', catKey === 'almacenamiento');
  
  renderTabs();
}

function renderTabs(){
  const tabsNav = document.getElementById('tabsNav');
  const mainEl = document.getElementById('main');
  
  tabsNav.innerHTML = '';
  mainEl.innerHTML = '';
  
  const currentTabs = CATEGORIES[currentCategory].tabs;
  
  currentTabs.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.textContent = t.label;
    btn.dataset.id = t.id;
    if(i === 0) btn.classList.add('active');
    btn.addEventListener('click', () => activateTab(t.id));
    tabsNav.appendChild(btn);
    
    const sec = document.createElement('div');
    sec.className = 'section' + (i === 0 ? ' active' : '');
    sec.id = 'sec-' + t.id;
    mainEl.appendChild(sec);
  });
  
  if(currentTabs.length > 0){
    activateTab(currentTabs[0].id);
  }
}

function activateTab(tabId){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.id === tabId));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'sec-' + tabId));
  
  if(RENDERERS[tabId]){
    RENDERERS[tabId](document.getElementById('sec-' + tabId));
  }
}

// ================= CARGA DE ARCHIVO EXCEL =================

function loadWorkbook(file, source){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(evt){
    try{
      const workbook=XLSX.read(new Uint8Array(evt.target.result),{type:'array',cellDates:true});
      localWorkbookData[source]={};localWorkbookNames[source]=workbook.SheetNames;
      const parsedSheets=workbook.SheetNames.map((name,index)=>({name,normalized:name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),rows:worksheetRows(workbook.Sheets[name],index)}));
      const findSheet=(...terms)=>parsedSheets.find(s=>terms.every(t=>s.normalized.includes(t)));
      if(source==='transporte'){
        const canonical=[
          findSheet('indicador general'), findSheet('ontime'),
          parsedSheets.find(s=>s.normalized.includes('infull')&&!s.normalized.includes('detalle')),
          findSheet('efectividad'), findSheet('retorno documental'),
          findSheet('ocupacion'), findSheet('averias'), findSheet('detalle','infull')
        ];
        canonical.forEach((s,i)=>{if(s)localWorkbookData[source][i]=s.rows;});
      }else{
        const canonical=[findSheet('inventario ciclico'),findSheet('ocupacion'),findSheet('cantidad ingresos'),findSheet('armado cigarrillo')];
        canonical.forEach((s,i)=>{if(s)localWorkbookData[source][i]=s.rows;});
      }
      document.getElementById(source==='transporte'?'transportSync':'storageSync').textContent='Cargado: '+file.name;
      const expected=source==='transporte'?['indicador general','ontime','infull','efectividad','retorno documental','ocupacion','averias']:['inventario ciclico','ocupacion','cantidad ingresos','armado cigarrillo'];
      const actual=parsedSheets.map(s=>s.normalized);
      const missing=expected.filter(label=>!actual.some(name=>name.includes(label)));
      if(missing.length)console.warn(`Faltan pestañas esperadas en el libro ${source}:`,missing);
      const activeBtn=document.querySelector('nav.tabs button.active');
      if(activeBtn){const id=activeBtn.dataset.id;const isStorage=CATEGORIES.almacenamiento.tabs.some(t=>t.id===id);if((source==='almacenamiento')===isStorage)RENDERERS[id](document.getElementById('sec-'+id));}
    }catch(err){document.getElementById(source==='transporte'?'transportSync':'storageSync').textContent='Error al leer el Excel';console.error(err);}
  };
  reader.readAsArrayBuffer(file);
}
document.getElementById('transportFile').addEventListener('change',e=>loadWorkbook(e.target.files[0],'transporte'));
document.getElementById('storageFile').addEventListener('change',e=>loadWorkbook(e.target.files[0],'almacenamiento'));

// Inicializar vista predeterminada
switchCategory('transporte');
